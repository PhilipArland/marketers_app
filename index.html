<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#214638">
    <title>My Workspace</title>
    <link rel="icon" type="image/png" href="/assets/media/marketers-logo.png">
    <link rel="apple-touch-icon" href="/assets/media/icon-192.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=swap" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
    <link rel="manifest" href="/manifest.webmanifest">
</head>

<body>
    <div class="app-shell d-flex">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-mark" id="brandMark">U</div>
                <div class="brand-name" id="brandName">User</div>
            </div>
            <div class="nav-label">Workspace</div>
            <nav class="nav flex-column" id="sidebarNav">
                <a class="nav-link active" href="#dashboard" data-page="dashboard"><i
                        class="bi bi-grid-1x2"></i>Dashboard</a>
                <a class="nav-link" href="#collection" data-page="collection"><i
                        class="bi bi-building"></i>Collection</a>
                <a class="nav-link" href="#email" data-page="email"><i class="bi bi-envelope"></i>Email</a>
                <a class="nav-link" href="#webmail" data-page="webmail"><i class="bi bi-globe2"></i>Webmail</a>
                <a class="nav-link" href="#helper" data-page="helper"><i class="bi bi-tools"></i>Helper</a>
                <a class="nav-link" href="#settings" data-page="settings"><i class="bi bi-gear"></i>Settings</a>
            </nav>
            <div class="sidebar-bottom">
                <div class="mb-2">
                    <img id="sidebarPet" alt="" hidden>
                </div>
                <div class="text-center">Designed by <strong>Flipped</strong> &copy; <span id="creditYear"></span></div>
            </div>
        </aside>

        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

        <main class="main-area">
            <header class="topbar">
                <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
                    <i class="bi bi-list"></i>
                </button>
                <div>

                    <div class="eyebrow" id="pageEyebrow">Workspace overview</div>
                    <h1 id="pageTitle">Dashboard</h1>
                </div>
                <div class="today-chip"><i class="bi bi-calendar3 me-2"></i><span id="todayLabel"></span></div>
            </header>
            <nav class="mobile-navbar" aria-label="Mobile workspace navigation">
                <a class="mobile-nav-link active" href="#dashboard" data-page="dashboard"><i
                        class="bi bi-grid-1x2"></i><span>Dashboard</span></a>
                <a class="mobile-nav-link" href="#collection" data-page="collection"><i
                        class="bi bi-building"></i><span>Collection</span></a>
                <a class="mobile-nav-link" href="#email" data-page="email"><i
                        class="bi bi-envelope"></i><span>Email</span></a>
                <a class="mobile-nav-link" href="#webmail" data-page="webmail"><i
                        class="bi bi-globe2"></i><span>Webmail</span></a>
                <a class="mobile-nav-link" href="#helper" data-page="helper"><i
                        class="bi bi-tools"></i><span>Helper</span></a>
                <a class="mobile-nav-link" href="#settings" data-page="settings"><i
                        class="bi bi-gear"></i><span>Settings</span></a>
            </nav>
            <div id="pageContent"></div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="assets/js/main.js"></script>
</body>

</html>
